name: Pruebas

# Corre en máquinas de GitHub (Ubuntu 24.04, fijo para que el cambio de
# ubuntu-latest no lo rompa sin aviso), nunca en los equipos propios del Mac
# mini. Las mismas pruebas se corren en local con `npm test` y `npm run punta`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: xmllint para validar los ejemplos contra los esquemas oficiales
        run: sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils
      - name: Dependencias
        run: npm ci
      - name: Pruebas de la lógica, las reglas, los ejemplos y la página
        run: npm test
      # Los tres motores de Windows y Mac: Chromium (Chrome y Edge), Firefox y WebKit (Safari).
      - name: Navegadores para la prueba de punta a punta
        run: npx playwright-core install --with-deps --only-shell chromium firefox webkit
      - name: Prueba de punta a punta en Chromium, Firefox y WebKit sin internet
        run: npm run punta
